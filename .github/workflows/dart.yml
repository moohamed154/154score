name: Flutter Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format code (no fail)
        run: dart format .

      - name: Run static analysis
        run: flutter analyze || true

      - name: Run tests
        run: flutter test || true

      - name: Build iOS (Release)
        run: |
          rm -rf ios/Podfile ios/Podfile.lock ios/Pods
          flutter precache --ios
          flutter build ios --release --no-codesign

      - name: Create IPA (fixed structure)
        run: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found Runner.app at: $APP_PATH"
            mkdir -p build/ios/ipa/Payload
            cp -R "$APP_PATH" build/ios/ipa/Payload/
            (cd build/ios/ipa && zip -r -y Runner.ipa Payload)
            echo "Successfully generated build/ios/ipa/Runner.ipa"
            ls -lh build/ios/ipa/Runner.ipa
          else
            echo "ERROR: Runner.app not found under build/ios"
            find build/ios -maxdepth 3 || true
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/Runner.ipa
          if-no-files-found: error

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: |
            build/ios/ipa/Runner.ipa
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
