name: score154
description: "154Score - Production Ready Real-Time Football Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.10.10
  flutter_bloc: ^8.1.6
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  go_router: ^14.6.2
  equatable: ^2.0.7
  get_it: ^8.0.2
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  skeletonizer: ^3.0.0

  material_ui: any
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  screenshot: ^3.0.0
  flutter_cache_manager: ^3.4.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
